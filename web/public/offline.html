<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline · Horyon</title>
<!-- Static, script-free offline fallback served by the service worker when a navigation
     fails with no network. Deliberately NOT the app shell: the real pages carry a
     per-request nonce'd CSP, so a cached app-HTML page would replay a stale nonce. This
     page has no inline script and needs no nonce. -->
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #060606; color: #F0EDE6;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 30rem; }
  img { width: 56px; height: 56px; margin-bottom: 20px; }
  h1 { font-size: 20px; font-weight: 700; margin: 0 0 8px; letter-spacing: -0.2px; }
  p { color: #9c968a; margin: 0 0 20px; }
  a {
    display: inline-block; color: #060606; background: #D4AF37;
    text-decoration: none; font-weight: 600; padding: 9px 18px; border-radius: 8px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="Horyon" />
    <h1>You're offline</h1>
    <p>Horyon needs a connection to load the latest market intelligence. Reconnect and try again.</p>
    <a href="/">Retry</a>
  </div>
</body>
</html>
