sonar.projectKey=horyon
sonar.projectName=Horyon Crypto Assistant
sonar.projectVersion=1.0

# ── Sources ────────────────────────────────────────────────────────────────────
sonar.sources=app,web/app,web/lib,web/middleware.js,web/next.config.js
sonar.tests=tests,web/tests

# ── Python ─────────────────────────────────────────────────────────────────────
sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

# ── JavaScript ─────────────────────────────────────────────────────────────────
# JS coverage (lcov) is optional — static analysis runs without it.
# To enable: add c8/istanbul to web dev-deps and update scripts/sonar-scan.sh.
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# ── Encoding ───────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Exclusions ─────────────────────────────────────────────────────────────────
sonar.exclusions=\
  **/__pycache__/**,\
  **/*.pyc,\
  **/.next/**,\
  **/node_modules/**,\
  web/public/**,\
  deploy/**,\
  backups/**,\
  .venv/**,\
  scripts/**

sonar.test.exclusions=tests/**,web/tests/**
sonar.coverage.exclusions=web/next.config.js,web/middleware.js
