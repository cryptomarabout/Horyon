services:
  db:
    image: pgvector/pgvector:pg16
    container_name: horyon-db
    restart: always
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: crypto
    # Bound to localhost only — the DB must never be reachable from the public internet.
    # Use an SSH tunnel for remote psql access.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crypto_db:/var/lib/postgresql/data
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    image: horyon
    container_name: horyon-bot
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://crypto:${POSTGRES_PASSWORD}@db:5432/crypto
      - CMC_API_KEY=${CMC_API_KEY:-}
      # Embeddings via NIM API (EMBED_* from .env / config defaults) — no host Ollama since 2026-07-21.
      - WEBHOOK_LISTEN_HOST=0.0.0.0
      - WEBHOOK_PORT=8080
      # Podcast transcripts: yt-dlp uses these cookies to get past YouTube's
      # datacenter-IP bot wall. Mounted read-only; yt-dlp copies to a temp jar per run.
      - PODCAST_YTDLP_COOKIES=/secrets/cookies.txt
    volumes:
      - ./cookies.txt:/secrets/cookies.txt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('localhost',8080),2)\""]
      interval: 20s
      timeout: 5s
      retries: 5

  monitor:
    image: horyon
    container_name: horyon-monitor
    restart: always
    command: python -m app.monitor
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://crypto:${POSTGRES_PASSWORD}@db:5432/crypto
      - MONITOR_PORT=8090
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/healthz')\""]
      interval: 20s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      network: host
    image: horyon-web
    container_name: horyon-web
    restart: always
    # PUBLIC, internet-facing container — ZERO paid-LLM egress (see api/search/route.js).
    # No LLM provider keys are injected here on purpose: nothing in web/app reaches
    # web/lib/llm.js, so handing this container OPENROUTER/NIM keys would only add blast
    # radius if it were ever compromised. It connects as the least-privilege `horyon_web`
    # role (SELECT-only + UPDATE on digest_threads), NOT the table owner — see
    # deploy/web_db_role.sql.
    environment:
      - DATABASE_URL=postgresql://horyon_web:${WEB_DB_PASSWORD}@db:5432/crypto
      # (web is zero-LLM / zero-embed — search is in-DB Postgres FTS; no Ollama/embed env needed)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2
    container_name: horyon-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      # Static marketing landing served at the apex (horyon.xyz). Read-only bind mount;
      # edits to deploy/landing/* are live after the page is re-requested (no rebuild).
      - ./deploy/landing:/srv/landing:ro
      - crypto_caddy:/data
    depends_on:
      - bot
      - monitor
      - web

volumes:
  crypto_db:
  crypto_caddy:
